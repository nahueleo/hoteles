<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detalle · Navidad en Río</title>
<link rel="stylesheet" href="/css/site.css">
<style>
.item{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.item .cover{height:220px;background:linear-gradient(135deg,#cfe7df,#f1e6cf);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--brand);font-weight:600}
.item .cover img{width:100%;height:100%;object-fit:cover}
.item .body{padding:22px}
.item h1{margin:6px 0 4px;font-size:1.6rem;letter-spacing:-.2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}
.facts div{background:var(--bg);border-radius:12px;padding:10px 12px}
.facts b{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.section{margin-top:18px}
.section h2{font-size:1rem;margin:0 0 6px}
.section p{margin:0 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
iframe{width:100%;height:280px;border:0;border-radius:12px;margin-top:8px}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:var(--muted);font-size:.9rem}
.back:hover{color:var(--brand)}
.optgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.opt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.opt:hover{border-color:var(--brand)}
.opt b{font-size:.95rem}
.opt span{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="/">Navidad en Río<small>Barra da Tijuca · 2026</small></a>
  <nav class="menu"><a href="/">Inicio</a><a href="/cena">Cena Navidad</a><a href="/actividades">Actividades y comidas</a></nav>
</div></header>
<main class="wrap" style="padding-top:24px;padding-bottom:50px">
  <div id="root"><p class="note">Cargando…</p></div>
</main>
<div class="toast" id="toast"></div>
<footer class="footer">Datos del grupo · actualizado el 16/11/2026</footer>

<script src="/js/data.js"></script>
<script src="/js/zona.js"></script>
<script src="/js/common.js"></script>
<script>
var id = String(new URLSearchParams(location.search).get("id") || decodeURIComponent(location.pathname.replace(/^\/item\/?/,"").replace(/\/$/,""))).split(/\s/)[0];
var votes = {}, actVotes = {}, custom = [], liked = getJSON("liked-v2", []), actLikedList = getJSON("actliked-v1", []);

function findItem(){
  var r = DATA.filter(function(d){ return d.id===id; })[0];
  if (r) return { kind:"rest", d:r };
  var f = (typeof FOOD!=="undefined" ? FOOD : []).filter(function(x){ return x.id===id; })[0];
  if (f) return { kind:"act", d:{id:f.id,name:f.name,cat:"comida",day:null,precio:f.precio,rec:f.rec,que:f.que,dist:f.dist,foto:f.foto,web:f.web,webq:f.webq} };
  var a = ACTIVITIES.filter(function(x){ return x.id===id; })[0];
  if (!a) a = custom.filter(function(c){ return c.id===id; })[0];
  if (a) return { kind:"act", d:a };
  return null;
}
function fact(label, value){ return value ? '<div><b>'+esc(label)+'</b>'+esc(value)+'</div>' : ''; }

function renderRest(d){
  var isLiked = liked.indexOf(d.id)>-1;
  var n = votes[d.id]||0;
  var price = d.precio==null ? "Precio no verificado" : "R$ "+d.precio.toLocaleString("es-AR")+(d.est?" (est.)":"");
  var total = d.total==null ? "—" : "R$ "+d.total.toLocaleString("es-AR")+(d.totalest?" (est.)":"");
  var dist = d.km===0 ? "En el hotel" : d.km.toFixed(1)+" km · "+d.min+" min en auto";
  var map = 'https://www.google.com/maps?q='+encodeURIComponent(d.q)+'&output=embed';
  return '<article class="item"><div class="cover">'+(d.foto?'<img src="'+esc(d.foto)+'" alt="'+esc(d.name)+'">':'Sin foto cargada')+'</div>'
    + '<div class="body">'
    + '<div class="chips"><span class="chip">'+esc(d.tipo)+'</span>'+(d.hotel?'<span class="chip day">Hotel</span>':'')+'<span class="chip '+(d.cena==="ok"?'':'day')+'">Cena 24: '+(d.cena==="ok"?'confirmada':'sin respuesta aún')+'</span></div>'
    + '<h1>'+esc(d.name)+'</h1>'
    + '<div class="facts">'
    +   fact("Precio por persona", price) + fact("Total grupo (15)", total) + fact("Distancia", dist)
    +   fact("Google", d.g!=null ? d.g.toFixed(1)+" ★" : "") + fact("Niños", d.kids) + fact("Vista al mar", d.mar)
    + '</div>'
    + '<div class="section"><h2>Cena de Nochebuena</h2><p>'+esc(d.ceia||"Sin información")+'</p></div>'
    + (d.note ? '<div class="section"><h2>Notas</h2><p>'+esc(d.note)+'</p></div>' : '')
    + (d.res ? '<div class="section"><h2>Reserva</h2><p>'+esc(d.res)+'</p></div>' : '')
    + '<div class="section"><h2>Ubicación</h2><iframe loading="lazy" src="'+esc(map)+'"></iframe></div>'
    + '<div class="row">'
    +   '<button class="btn primary" data-like="'+esc(d.id)+'" '+(isLiked?'disabled':'')+'>'+(isLiked?'✓ Te gusta':'♥ Me gusta')+' · '+n+'</button>'
    +   '<button class="btn" id="share">Compartir</button>'
    +   (d.ig?'<a class="btn ghost" href="'+esc(d.ig)+'" target="_blank" rel="noopener">Instagram</a>':'')
    +   (d.src?'<a class="btn ghost" href="'+esc(d.src)+'" target="_blank" rel="noopener">Fuente</a>':'')
    +   '<a class="btn ghost" href="/cena">← Volver a cenas</a>'
    + '</div></div></article>';
}

function renderAct(a){
  var voted = actLikedList.indexOf(a.id)>-1;
  var n = actVotes[a.id]||0;
  var dist = a.dist || (a.km!=null ? "~"+a.km+" km" : "Por confirmar");
  var foto = a.foto || ("https://www.google.com/search?tbm=isch&q="+encodeURIComponent(a.name));
  var cover = a.img ? '<img src="'+esc(a.img)+'" alt="'+esc(a.name)+'">' : 'Ver fotos de '+esc(a.name);
  return '<article class="item"><a class="cover" href="'+esc(a.img?a.img:foto)+'" target="_blank" rel="noopener">'+cover+'</a>'
    + '<div class="body">'
    + '<div class="chips">'+(a.day?'<span class="chip day">'+a.day+' de diciembre</span>':'<span class="chip day">Día por definir</span>')+'<span class="chip cat-'+esc(a.cat)+'">'+esc(catLabel(a.cat))+'</span>'+(a.custom?'<span class="badge-u">Sugerida por el grupo</span>':'')+'</div>'
    + '<h1>'+esc(a.name)+'</h1>'
    + '<div class="facts">'
    +   fact("Distancia", dist) + fact("Precio", a.precio) + fact("Recomendado para", a.rec)
    + '</div>'
    + (a.que ? '<div class="section"><h2>Descripción</h2><p>'+esc(a.que)+'</p></div>' : '')
    + '<div class="row">'
    +   '<button class="btn primary" data-avote="'+esc(a.id)+'" '+(voted?'disabled':'')+'>'+(voted?'✓ Votado':'Votar')+' · '+n+'</button>'
    +   '<button class="btn" id="share">Compartir</button>'
    +   '<a class="btn ghost" href="/actividades#'+esc(a.id)+'">Elegir día</a>'
    +   ((a.web||a.webq)?'<a class="btn ghost" href="'+esc(a.web||a.webq)+'" target="_blank" rel="noopener">'+(a.web?'Sitio web':'Buscar web')+'</a>':'')
    +   '<a class="btn ghost" href="/actividades">← Volver a actividades</a>'
    + '</div></div></article>';
}

function renderMenu(){
  var root = document.getElementById("root");
  document.title = "Opciones · Navidad en Río";
  var cenas = DATA.map(function(d){ return '<a class="opt" href="/item?id='+encodeURIComponent(d.id)+'"><b>'+esc(d.name)+'</b><span>'+esc(d.tipo)+' · '+(d.precio==null?'precio por confirmar':'R$ '+d.precio.toLocaleString("es-AR")+(d.est?' est.':'')+' pp')+'</span></a>'; }).join("");
  var acts = ACTIVITIES.concat(custom).concat((typeof FOOD!=="undefined"?FOOD:[]).map(function(f){ return {id:f.id,name:f.name,cat:"comida",precio:f.precio,dist:f.dist}; })).map(function(a){ return '<a class="opt" href="/item?id='+encodeURIComponent(a.id)+'"><b>'+esc(a.name)+'</b><span>'+esc(catLabel(a.cat))+(a.day?' · '+a.day+' dic':'')+(a.custom?' · sugerida':'')+'</span></a>'; }).join("");
  root.innerHTML = '<h1 style="margin:0 0 6px">Elegí qué ver</h1><p class="note">Abrí el detalle completo de cualquier cena o actividad.</p>'
    + '<h2 class="sec-title">Cenas de Nochebuena</h2><div class="optgrid">'+cenas+'</div>'
    + '<h2 class="sec-title">Actividades</h2><div class="optgrid">'+acts+'</div>';
}

function render(){
  var it = findItem();
  var root = document.getElementById("root");
  if (!it){ root.innerHTML = '<p class="note">No encontramos esa opción. <a href="/">Volver al inicio</a>.</p>'; return; }
  document.title = it.d.name + " · Navidad en Río";
  root.innerHTML = it.kind==="rest" ? renderRest(it.d) : renderAct(it.d);
  var sh = document.getElementById("share");
  if (sh) sh.addEventListener("click", function(){ shareLink(id, it.d.name); });
  var lb = document.querySelector("[data-like]");
  if (lb) lb.addEventListener("click", function(){
    lb.disabled = true;
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"like",id:id})})
      .then(function(r){return r.json();}).then(function(d){ liked.push(id); setJSON("liked-v2", liked); votes = d.likes||votes; render(); toast("Voto registrado"); })
      .catch(function(){ lb.disabled=false; toast("No se pudo registrar"); });
  });
  var av = document.querySelector("[data-avote]");
  if (av) av.addEventListener("click", function(){
    av.disabled = true;
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"actlike",id:id})})
      .then(function(r){return r.json();}).then(function(d){ actLikedList.push(id); setJSON("actliked-v1", actLikedList); actVotes = d.actlikes||actVotes; render(); toast("Voto registrado"); })
      .catch(function(){ av.disabled=false; toast("No se pudo registrar"); });
  });
}

if (!id) { location.replace("/actividades"); } else { render(); }
fetch(API).then(function(r){return r.json();}).then(function(d){
  votes = d.likes||{}; actVotes = d.actlikes||{}; custom = (d.actcustom||[]).map(function(c){
    return {id:c.id,name:c.name,cat:c.cat,day:c.day,precio:c.precio||"Consultar",rec:c.rec||"Todos",que:c.que||"",custom:true,web:c.link||"",foto:"",webq:"https://www.google.com/search?q="+encodeURIComponent(c.name)};
  });
  if (!id) location.replace("/actividades"); else render();
}).catch(function(){ toast("No se pudieron cargar los votos"); });
</script>
</body>
</html>
